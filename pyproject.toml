[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "votebot"
version = "0.1.0"
description = "Personal ballot helper: your races, candidates enriched from several sources, picks, notes and a printable list."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # for trackaipac_cache, which lives in this repo
    "requests>=2.28",
    "html2text>=2020.1.16",
]

[project.scripts]
votebot = "votebot.__main__:main"
trackaipac-cache = "trackaipac_cache.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]  # installed by `uv sync`

[tool.setuptools]
packages = ["votebot", "votebot.sources", "trackaipac_cache"]

[tool.setuptools.package-data]
votebot = ["static/*.html", "static/css/*.css", "static/js/*.js"]
trackaipac_cache = ["data/*.json", "data/history/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = '-m "not live"'
markers = ["live: calls the real external APIs (run with: uv run pytest -m live)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
