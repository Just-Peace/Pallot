[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pallot"
dynamic = ["version"]  # pallot.__version__
description = "Personal ballot helper: your races, candidates enriched from several sources, picks, notes and a printable list."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # for trackaipac_cache, which lives in this repo
    "html2text>=2020.1.16",
]

[project.scripts]
pallot = "pallot.__main__:main"
trackaipac-cache = "trackaipac_cache.__main__:main"
tec-cache = "tec_cache.__main__:main"
voteforpeace-cache = "voteforpeace_cache.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.5", "respx>=0.21"]  # installed by `uv sync`

[tool.setuptools]
packages = ["pallot", "pallot.sources", "trackaipac_cache", "tec_cache", "voteforpeace_cache"]

[tool.setuptools.dynamic]
version = { attr = "pallot.__version__" }

[tool.setuptools.package-data]
pallot = ["static/*.html", "static/*.svg", "static/css/*.css", "static/js/*.js", "static/vendor/*/*", "endorsements/*.json"]
trackaipac_cache = ["data/*.json", "data/history/*.json"]
tec_cache = ["data/*.json"]
voteforpeace_cache = ["data/*.json", "data/history/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = '-m "not live" -n auto --dist loadgroup'
markers = ["live: calls the real external APIs (run with: uv run pytest -m live)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
