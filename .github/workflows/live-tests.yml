name: Live tests

on:
  workflow_dispatch:

concurrency:
  group: live-tests
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.10"

      - run: uv sync --locked

      - env:
          PALLOT_FEC_API_KEY: ${{ secrets.PALLOT_FEC_API_KEY }}
        run: uv run pytest -m live
