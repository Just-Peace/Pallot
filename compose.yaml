# docker compose up -d --build  ->  Pallot on http://<this machine>:8000
# Pallot has no login: run this only on a network you trust. Refresh and prune its cache from the host:
#   docker compose exec pallot pallot-cache check   (also refresh, prune, hard-refresh, rebuild)
services:
  pallot:
    build: .
    image: pallot
    init: true  # reaps the process a TEC refresh runs in
    restart: unless-stopped
    ports:
      - "${PALLOT_PORT:-8000}:8000"  # every interface; "127.0.0.1:8000:8000" keeps it to this machine
    env_file:
      - path: .env  # the same .env as `uv run pallot` (FEC key, cache lifetimes)
        required: false
    environment:
      PALLOT_DATA_DIR: /data  # wins over a host path in .env
    user: "${PALLOT_UID:-1000}:${PALLOT_GID:-1000}"  # whoever owns data/ on a Linux host
    volumes:
      - ${PALLOT_DATA_DIR:-./data}:/data  # the folder `uv run pallot` uses, so its cache carries over
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
